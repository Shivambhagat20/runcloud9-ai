name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test
        run: pytest -q

      - name: Offline eval (golden baseline)
        run: python -m eval.run

      - name: Offline ablation eval
        run: python -m eval.ablation_run

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: runcloud9-505411
      CLUSTER_NAME: cloud9
      CLUSTER_REGION: us-central1
      GAR_HOST: us-central1-docker.pkg.dev
      GAR_REPO: cloud9-images
      IMAGE_NAME: runcloud9-ai
      NAMESPACE: cloud9-system
      DEPLOYMENT_NAME: runcloud9-ai
      CONTAINER_NAME: runcloud9-ai
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $GAR_HOST --quiet

      - name: Build and push image
        env:
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$GAR_HOST/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME"
          docker build -t "$IMAGE:$SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$SHA"
          docker push "$IMAGE:latest"

      - name: Get GKE credentials
        run: gcloud container clusters get-credentials "$CLUSTER_NAME" --region "$CLUSTER_REGION" --project "$PROJECT_ID"

      - name: Deploy to GKE
        env:
          SHA: ${{ github.sha }}
        run: |
          IMAGE="$GAR_HOST/$PROJECT_ID/$GAR_REPO/$IMAGE_NAME"
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/"$DEPLOYMENT_NAME" \
            "$CONTAINER_NAME"="$IMAGE:$SHA" \
            -n "$NAMESPACE"
          kubectl rollout status deployment/"$DEPLOYMENT_NAME" -n "$NAMESPACE" --timeout=180s
