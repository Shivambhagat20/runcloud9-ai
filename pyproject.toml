[project]
name = "runcloud9-ai"
version = "0.1.0"
description = "Python inference layer for Runcloud9"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.32.0,<1.0",
    "pydantic>=2.10.0,<3.0",
    "litellm>=1.55.0,<2.0",
    "httpx>=0.28.0,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0",
]

[tool.uv]
package = false
