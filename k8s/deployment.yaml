apiVersion: apps/v1
kind: Deployment
metadata:
  name: runcloud9-ai
  namespace: cloud9-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: runcloud9-ai
  template:
    metadata:
      labels:
        app: runcloud9-ai
    spec:
      containers:
        - name: runcloud9-ai
          image: us-central1-docker.pkg.dev/runcloud9-505411/cloud9-images/runcloud9-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
              ephemeral-storage: "50Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "100Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
          env:
            - name: CLOUD9_API_URL
              value: "http://cloud9-api"
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: runcloud9-ai-secrets
                  key: anthropic-api-key
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: runcloud9-ai
  namespace: cloud9-system
spec:
  selector:
    app: runcloud9-ai
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP
